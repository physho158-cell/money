[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myanmar-video-dubber"
version = "0.2.0"
description = "A Telegram bot that dubs YouTube Shorts and uploaded videos into Myanmar (Burmese)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.0,<8",
  "fastapi>=0.115,<1",
  "openai>=1.54,<3",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=21.10,<23",
  "uvicorn>=0.32,<1",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
myanmar-dubber = "myanmar_dubber.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
